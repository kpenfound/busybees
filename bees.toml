# bees.toml — configuration for a busybees software factory.
version = 5

#===============================================================================
# Project
#===============================================================================
[project]
# Prefix for developer branches (bees/issue-12).
branch_prefix = "bees/"


#===============================================================================
# Issue Filter
#===============================================================================
[filter]
# The factory's label; also the base name of the workflow labels
# (bees:triage, bees:ready, bees:in-progress, ...).
label = "bees"
# Only see items opened by this GitHub login. What the factory opens itself
# is visible too, whoever it acts as.
creator = "kpenfound"

#===============================================================================
# GitHub account the factory acts as.
#===============================================================================
[github]
# GitHub login the factory acts as.
login = "penfoundapps"
# A token for that login. A "$VAR" reference is expanded from the environment
# bees runs in, so the secret itself stays out of this file.
token = "$BEES_GITHUB_TOKEN"
# Identity for commits made by developer sessions. Either may be set on its
# own; whichever is unset stays the machine's own git identity.
git_name = "penfoundapps"
git_email = "penfoundapps@gmail.com"

#===============================================================================
# Scheduler
#===============================================================================
[scheduler]
# How often GitHub is polled for work. Each poll costs two API calls; keep it
# infrequent. Sessions make their own gh calls on top of this.
poll_interval = "5m"
# Concurrent developer workers. Each runs a sequential developer <-> reviewer
# loop for one issue; reviewer concurrency follows developer concurrency.
max_developers = 2
# Minimum time between QA runs. QA only runs when something was merged.
qa_interval = "4h"
# GitHub logins and/or org/team slugs the factory turns to when it needs a
# person: mentioned in the needs-human comment and in the product manager's
# questions, and asked to review an approved pull request. No leading @.
notify = ["kpenfound"]
# The first poll of the work day happens the moment the window opens, whatever
# off_hours_poll_interval is.
#work_hours = "11:00-23:59"
# Default: 1h, or poll_interval when that is longer.
off_hours_poll_interval = "2h"
work_days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
# Whole factory, rolling 24 hours. At or over it no new session starts; the
# sessions already running finish.
#max_cost_per_day = 200.0
#max_cost_per_day_resume_percent = 70.0
# Ask for consolidation early once a notes file grows past this many bytes.
notes_max_bytes = 18768
# Build a blocked_by chain of work items under the same feature as a stack of
# branches and pull requests, each depending on its predecessor's, instead of
# independently.
stacked_prs = false

# Agent profiles are defined in ~/.config/bees/defaults.toml.

#===============================================================================
# Global role settings
#===============================================================================
[global]
profile = "default"
# Text appended to every role's base prompt.
prompt = """
NEVER run go test on the host, in any role and for any reason: reproducing a
flake, a mutation check and a single test included. Tests start processes that
leak onto the machine the factory runs on. Tests run only inside Dagger: dagger
check for the suite, and the single-test command in AGENTS.md for one package or
test. go build, go vet and gofmt are fine on the host; go vet type-checks tests.
"""
# File whose contents are appended after prompt (relative to this file).
#prompt_file = "docs/team-conventions.md"
# Skills by git URL: <url>[@ref][#sub/dir], cloned and exposed to claude as
# plugins. Skills in the repository's .claude/skills/ and in ~/.claude/skills/
# are available automatically and need not be listed.
skills = [
  "https://github.com/poteto/plugins#pstack/skills/unslop",
]

# Agentic turns per session and wall-clock limit.
#max_turns = 200
#timeout = "45m"
# Tool restrictions passed straight to claude.
#allowed_tools = []
disallowed_tools = ["Artifact", "Bash(go test *)", "Bash(docker *)"]
# Shell for claude's Bash tool in sessions (exported as $SHELL).
#shell = "/bin/bash"


# Environment variables exported into every session (claude, its Bash tool,
# MCP servers, git). $VARS are expanded from the bees environment. Roles can
# add or override entries in [roles.<name>.env].
[global.env]
DAGGER_X_RELEASE = "v1.0.0-beta.14"

# MCP servers available to every role, one table per server. stdio servers
# use command/args/env; remote servers use url (+ type = "http" | "sse",
# headers). $VARS in env and headers are expanded from the bees environment.
#[global.mcp.github]
#command = "npx"
#args = ["-y", "@modelcontextprotocol/server-github"]
#env = { GITHUB_PERSONAL_ACCESS_TOKEN = "$GITHUB_TOKEN" }


#===============================================================================
# Per-role settings.
#===============================================================================

# Owns the product vision and feature issues; breaks features into work items.
[roles.product_manager]
profile = "manager_smart"

# Triages issues into build-ready work and answers developer questions.
[roles.project_manager]
profile = "manager_dumb"

# Implements one issue on a branch and opens a pull request.
[roles.developer]
profile = "coder_medium"
profile_by_size = { l = "coder_smart", m = "coder_medium", s = "coder_dumb", xs = "coder_dumb" }
# Largest size a developer takes: xs, s, m, l or xl. Anything bigger is sent
# back to triage for the project manager to split.
#max_size = "l"
# Skills by git URL: <url>[@ref][#sub/dir], cloned and exposed to claude as
# plugins. Skills in the repository's .claude/skills/ and in ~/.claude/skills/
# are available automatically and need not be listed.
skills = [
  "https://github.com/mattpocock/skills#skills/engineering/codebase-design",
  "https://github.com/mattpocock/skills#skills/engineering/resolving-merge-conflicts",
  "https://github.com/mattpocock/skills#skills/engineering/tdd",
]

# Reviews pull requests and, optionally, merges them once checks are green.
[roles.reviewer]
# Merge approved pull requests automatically once the required checks are
# green. Off: humans merge. When checks fail the reviewer diagnoses the main
# error and hands it to the developer to fix (up to max_check_fix_rounds).
#auto_merge = true
# Skills by git URL: <url>[@ref][#sub/dir], cloned and exposed to claude as
# plugins. Skills in the repository's .claude/skills/ and in ~/.claude/skills/
# are available automatically and need not be listed.
skills = [
  "https://github.com/mattpocock/skills#skills/engineering/code-review",
]
# The review angles a pull request of each size is reviewed from, one or more
# of quick_general, general, docs, test_coverage, acceptance_criteria,
# side_effects. A size not named here gets its default:
angles = { xs = ["quick_general"], s = ["quick_general"], m = ["quick_general", "docs", "test_coverage"], l = ["general", "docs", "test_coverage"], xl = ["general", "docs", "test_coverage", "acceptance_criteria"] }
# Phase execution profiles; unspecified phases use the size-resolved reviewer.
# Brief/angles ignore sandbox and retain the host read-only floor: no commands,
# writes, web/network tools, MCP/factory identity or writable/shared VCS.
# The judge uses all five fields with reviewer-owned tools and permissions.
brief_profile = "review_fast"
judge_profile = "default"
angle_profiles = { quick_general = "review_fast", docs = "review_fast", test_coverage = "default" }

# Tests the default branch after merges, files bugs, reports to the PM.
[roles.qa]
profile = "coder_medium"
#enabled = true
