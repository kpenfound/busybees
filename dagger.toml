# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go"

[modules.go.settings]
base = "golang:1.26-bookworm"
# bees.example.toml is a golden file compared against internal/config's
# template by TestExampleTOMLInSync; the built-in Go patterns do not mount it.
includeExtraFiles = ["bees.example.toml"]
