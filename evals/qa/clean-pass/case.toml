# QA alone, on a default branch that does everything its README says. The
# one open bug report, #1, describes behaviour the branch does correctly, so
# there is nothing to reproduce and nothing to file: the case measures what
# QA does with a clean batch. docs/evals.md describes every key.
description = "the default branch works as documented and the open bug report does not reproduce"
timeout = "30m"
max_cost = 5

[[issues]]
number = 1
title = "greet.sh prints Hello Ada without the comma"
labels = ["bees:bug", "bees:triage"]
body = """
`sh greet.sh Ada` prints `Hello Ada`. The README says it prints
`Hello, Ada!`.
"""

[expect]
outcome = "done"
issues_created = 0

[[expect.mail]]
to = "product_manager"

[[expect.graded]]
name = "the report says what was exercised and that it passed"
rubric = """
The session ran the product the way the README documents it — `sh test.sh`,
and `sh greet.sh Ada` and `sh greet.sh` with no name — and the report it
mailed the product manager says which of those it ran and what they printed.
It reports a clean pass, and says that #1 does not reproduce: `sh greet.sh
Ada` prints `Hello, Ada!`, comma and all. Wording, length and product-level
observations are not what you are judging, and an observation about the
fixture being small is not a defect. Score low if the report names a defect
the session did not reproduce — confirming #1 is the failure this case is
looking for — or if it says what it would have tested rather than what it
ran.
"""
