# The developer on a second round: a pull request of its own is open and the
# reviewer has asked for three things by mail. docs/evals.md describes every
# key.
#
# #1 carries bees:in-progress and not bees:review on purpose. The state label
# is what a worker with an open pull request resumes from, and bees:review
# would resume it into the review stage — a reviewer session, which this case
# does not run.
#
# The three points the mail raises are each checkable from the change alone:
# a signature and the errors it returns, a test in a named file, and two
# named places that document the command. A rubric asking whether "the
# feedback was addressed" would score the grader's taste instead.
description = "three review findings on an open pull request, to address in one round"
issue = 1
pr = 2
timeout = "30m"
max_cost = 5

[[issues]]
number = 1
title = "todo rm <n> removes an item from the list"
labels = ["bees:in-progress", "bees:size/s"]
body = """
There is no way to take an item off the list except by editing the file.

## Acceptance criteria

- `List.Remove(n)` takes item n out of the list, counting from 1, and
  returns what is left.
- `todo rm <n>` removes item n and writes the file back.
- `go test ./...` passes.
"""

[[pull_requests]]
number = 2
title = "todo rm <n>"
head = "bees/issue-1"
body = """
Closes #1

`List.Remove` takes an item out of the list and `todo rm <n>` calls it.

## Testing

`go test ./...`
"""

[[mail]]
from = "reviewer"
to = "developer"
issue = 1
subject = "Changes requested on #2"
body = """
Three things before this can be approved.

1. `List.Remove` takes no bad number seriously: `Remove(0)` and
   `Remove(len(l)+1)` panic on the slice. Make it `Remove(n int) (List,
   error)` and return an error for 0, for a negative number and for a number
   past the end of the list, leaving the list unchanged in each case.
   `todo rm` returns that error rather than dropping it.

2. Nothing tests `Remove`. Add a test to `todo/list_test.go` that removes the
   middle item of a three-item list and checks the item order that is left,
   and that covers the three error cases from point 1.

3. `rm` is not documented. Add it to the command list in the doc comment at
   the top of `cmd/todo/main.go`, and to the usage block of `README.md`
   beside the `list`, `add` and `done` examples.
"""

# expect.pull_requests and a label check are left out: the pull request is
# seeded on the issue's branch, so "#1 has a pull request" passes before the
# session starts, and with the reviewer out of scope the worker labels the
# issue bees:approved on its own once the round reports pr-updated. Neither
# would say anything about the round.
[expect]
outcome = "pr-updated"

[[expect.graded]]
name = "Remove refuses a bad number and returns an error"
rubric = """
The session changed `List.Remove` in `todo/list.go` to return an error
alongside the list, and it returns one for 0, for a negative number and for a
number past the end of the list, leaving the list unchanged in those cases.
`Remove(2)` on a three-item list still takes the second item out. The `rm`
case in `cmd/todo/main.go` returns the error instead of ignoring it.

Judge the code, not the wording of the error or where the bounds check sits.
"""

[[expect.graded]]
name = "a test in todo/list_test.go covers Remove"
rubric = """
The session added a test to `todo/list_test.go` — not to a new file, and not
only to the command's tests — that removes the middle item of a three-item
list and asserts which items are left and in which order, and that asserts
`Remove` returns an error for 0, for a negative number and for a number past
the end of the list.

Judge whether those cases are covered, not the test's name or style. A test
that only calls `Remove` without asserting anything does not count.
"""

[[expect.graded]]
name = "rm is documented in both places the reviewer named"
rubric = """
The session added `rm` to the command list in the doc comment at the top of
`cmd/todo/main.go`, and to the usage block in `README.md` beside the `list`,
`add` and `done` examples. Both places, not one of them.

Judge whether both were changed, not how the line is phrased.
"""

[[expect.graded]]
name = "the pull request description answers all three findings"
rubric = """
The session pushed and rewrote the pull request's description: it says what
changed for each of the three points the reviewer raised, in a section of its
own for the round, and says how the change was checked. A description that
still reads as the first round did, or that answers only some of the points,
does not meet this.

Ignore the wording, the section's title and the commit history.
"""
